# Nginx para o wpp-bicicleta (Node na porta 5000)
#
# 1. Copie para /etc/nginx/sites-available/casadasbicicletas.site
# 2. ln -s /etc/nginx/sites-available/casadasbicicletas.site /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. HTTPS: certbot --nginx -d casadasbicicletas.site -d www.casadasbicicletas.site
#    (o certbot acrescenta sozinho o bloco 443 e o redirecionamento de http para https)

server {
    listen 80;
    listen [::]:80;
    server_name casadasbicicletas.site www.casadasbicicletas.site;

    # Webhook da Evolution pode trazer payloads maiores
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fotos e vídeos do catálogo: a Evolution baixa daqui para mandar ao cliente
    location /midia/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
