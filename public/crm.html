<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<title>CRM · Casa das Bicicletas</title>
<style>
  :root {
    --bg:#f7f7f8; --card:#fff; --txt:#18181b; --sub:#71717a; --borda:#e4e4e7; --hover:#f4f4f5; --sel:#f0f0f2;
    --acc:#18181b; --acc-txt:#fff; --ponto-on:#22c55e; --ponto-off:#a1a1aa;
    --cli:#fff; --nos:#f0f0f2;
    --ads-bg:#ffedd5; --ads-txt:#c2410c;
    --st-novo-bg:#f4f4f5; --st-novo-txt:#52525b;
    --st-humano-bg:#f3e8ff; --st-humano-txt:#7e22ce;
    --sombra:0 10px 30px rgba(0,0,0,.12);
    --st-atend-bg:#fef9c3; --st-atend-txt:#854d0e;
    --st-aguard-bg:#dbeafe; --st-aguard-txt:#1d4ed8;
    --st-vendido-bg:#dcfce7; --st-vendido-txt:#15803d;
    --st-perdido-bg:#fee2e2; --st-perdido-txt:#b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f0f11; --card:#18181b; --txt:#f4f4f5; --sub:#a1a1aa; --borda:#27272a; --hover:#1f1f23; --sel:#242428;
      --acc:#f4f4f5; --acc-txt:#18181b; --ponto-off:#52525b;
      --cli:#18181b; --nos:#26262a;
      --ads-bg:#431c06; --ads-txt:#fb923c;
      --st-novo-bg:#2a2a2e; --st-novo-txt:#d4d4d8;
      --st-humano-bg:#3b0764; --st-humano-txt:#d8b4fe;
      --sombra:0 10px 30px rgba(0,0,0,.5);
      --st-atend-bg:#422006; --st-atend-txt:#facc15;
      --st-aguard-bg:#172554; --st-aguard-txt:#60a5fa;
      --st-vendido-bg:#052e16; --st-vendido-txt:#4ade80;
      --st-perdido-bg:#450a0a; --st-perdido-txt:#f87171;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; overflow-x:hidden; -webkit-text-size-adjust:100%; touch-action:manipulation; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }

  .app { display:grid; grid-template-rows:auto minmax(0, 1fr); grid-template-columns:minmax(0, 1fr); height:100vh; height:100dvh; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--borda); }
  header h1 { font-size:15px; font-weight:600; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .global { display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:8px; border:1px solid var(--borda); background:var(--card); font-size:13px; }
  .global .ponto { width:7px; height:7px; border-radius:50%; background:var(--ponto-on); }
  .global.off .ponto { background:var(--ponto-off); }
  header a { color:var(--sub); font-size:13px; text-decoration:none; }

  /* minmax(0, …) e min-width:0: texto longo sem quebra (nowrap) não pode alargar a coluna */
  main { display:grid; grid-template-columns:minmax(280px, 340px) minmax(0, 1fr); min-height:0; }
  .lista, .conversa, .item { min-width:0; }
  .lista { border-right:1px solid var(--borda); background:var(--card); display:flex; flex-direction:column; min-height:0; }
  .filtros { padding:12px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--borda); }
  .filtros input { padding:8px 11px; border-radius:8px; border:1px solid var(--borda); background:var(--bg); outline:none; }
  .filtros input:focus { border-color:var(--sub); }
  .chips { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .ads, .st { display:inline-block; vertical-align:1px; padding:1px 7px; border-radius:999px;
              font-size:11px; font-weight:600; line-height:16px; border:0; }
  .ads { margin-right:5px; background:var(--ads-bg); color:var(--ads-txt); }
  /* Status: novo neutro, em atendimento amarelo, aguardando azul, vendido verde, perdido vermelho */
  .st-novo { background:var(--st-novo-bg); color:var(--st-novo-txt); }
  .st-humano { background:var(--st-humano-bg); color:var(--st-humano-txt); }
  .st-atend { background:var(--st-atend-bg); color:var(--st-atend-txt); }
  .st-aguard { background:var(--st-aguard-bg); color:var(--st-aguard-txt); }
  .st-vendido { background:var(--st-vendido-bg); color:var(--st-vendido-txt); }
  .st-perdido { background:var(--st-perdido-bg); color:var(--st-perdido-txt); }

  /* Menu de status (no lugar do select nativo) */
  .st-menu { position:relative; }
  .st-btn { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; font-size:12px; line-height:18px; }
  .st-btn .caret { font-size:9px; opacity:.7; }
  .st-pop { position:absolute; right:0; top:calc(100% + 6px); z-index:30; min-width:200px; padding:6px;
            background:var(--card); border:1px solid var(--borda); border-radius:10px; box-shadow:var(--sombra);
            display:flex; flex-direction:column; gap:2px; }
  .st-pop[hidden] { display:none; }
  .st-op { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:7px 8px;
           border:0; background:none; border-radius:6px; text-align:left; }
  .st-op:hover { background:var(--hover); }
  .st-op .ok { color:var(--sub); font-size:12px; }
  .filtro-st { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--borda); border-radius:8px;
               background:var(--bg); font-size:13px; color:var(--sub); }
  .filtro-st .caret { font-size:9px; opacity:.7; }
  .filtro-st.on { color:var(--txt); }
  #filtro-st-pop { left:0; right:auto; }
  .filtros .st-menu { align-self:flex-start; }

  /* Abas Conversas / Funil */
  .abas { display:flex; gap:2px; padding:2px; border:1px solid var(--borda); border-radius:8px; background:var(--bg); }
  .aba { border:0; background:none; padding:5px 12px; border-radius:6px; font-size:13px; color:var(--sub); }
  .aba.ativa { background:var(--card); color:var(--txt); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .espaco { flex:1; }

  /* Funil (kanban) */
  .funil { display:none; flex-direction:column; min-height:0; min-width:0; }
  .app.ver-funil main { display:none; }
  .app.ver-funil .funil { display:flex; }
  .funil-topo { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--borda); }
  .kpis { display:flex; gap:24px; flex:1; flex-wrap:wrap; }
  .kpi b { display:block; font-size:20px; line-height:1.2; font-variant-numeric:tabular-nums; }
  .kpi span { font-size:12px; color:var(--sub); }
  .colunas { flex:1; min-height:0; display:grid; grid-template-columns:repeat(6, minmax(180px, 1fr)); gap:10px; padding:12px 16px; overflow-x:auto;
             scrollbar-color:var(--borda) transparent; }
  .coluna { display:flex; flex-direction:column; min-height:0; background:var(--card); border:1px solid var(--borda); border-radius:12px; transition:border-color .15s, background .15s; }
  .coluna.alvo { border-color:var(--sub); background:var(--hover); }
  .col-topo { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-bottom:1px solid var(--borda); }
  .col-qtd { font-size:13px; font-weight:600; color:var(--sub); font-variant-numeric:tabular-nums; }
  .cartoes { flex:1; min-height:80px; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:8px; }
  .cartao { display:block; width:100%; text-align:left; padding:10px; border:1px solid var(--borda); border-radius:10px; background:var(--bg); cursor:grab; }
  .cartao:hover { border-color:var(--sub); }
  .cartao.arrastando { opacity:.4; }
  .cartao .previa { display:block; margin-top:2px; }
  .cartao .info { margin-top:6px; }
  .col-vazia { padding:16px 8px; text-align:center; font-size:12px; color:var(--sub); }
  .chip { padding:4px 10px; border-radius:6px; border:0; background:none; font-size:13px; color:var(--sub); white-space:nowrap; }
  .chip:hover { background:var(--hover); }
  .chip.ativo { background:var(--sel); color:var(--txt); font-weight:600; }
  .itens { overflow-y:auto; flex:1; }
  .item { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--borda); background:none; padding:12px 14px; }
  .item:hover { background:var(--hover); }
  .item.sel { background:var(--sel); }
  .linha { display:flex; align-items:center; gap:8px; }
  .nome { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hora { color:var(--sub); font-size:12px; }
  .previa { color:var(--sub); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .naolidas { background:var(--acc); color:var(--acc-txt); font-size:11px; font-weight:600; border-radius:999px; min-width:18px; padding:1px 6px; text-align:center; }
  .info { margin-top:3px; font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vazio { padding:40px 20px; text-align:center; color:var(--sub); }

  .conversa { display:flex; flex-direction:column; min-height:0; }
  .topo { background:var(--card); border-bottom:1px solid var(--borda); padding:12px 16px; }
  .topo-linha { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .voltar { display:none; border:0; background:none; font-size:20px; padding:0 4px 0 0; color:var(--sub); }
  .quem { flex:1; min-width:0; }
  .topo h2 { font-size:15px; margin:0; }
  .topo .sub { color:var(--sub); font-size:13px; margin-top:1px; }
  .topo .sub a { color:inherit; }
  .acoes { display:flex; gap:8px; align-items:center; }
  .btn { padding:6px 12px; border-radius:8px; border:1px solid var(--borda); background:var(--card); font-weight:500; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn.primario { background:var(--acc); border-color:var(--acc); color:var(--acc-txt); }

  .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:min(72%, 560px); padding:7px 11px 5px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.cliente { align-self:flex-start; background:var(--cli); border:1px solid var(--borda); }
  .msg.bot, .msg.atendente { align-self:flex-end; background:var(--nos); }
  .msg .meta { font-size:11px; color:var(--sub); text-align:right; margin-top:2px; }
  .msg { position:relative; }
  /* Responder (citar), como no WhatsApp */
  .btn-resp { position:absolute; top:50%; transform:translateY(-50%); width:28px; height:28px; display:grid; place-items:center;
              border:1px solid var(--borda); border-radius:50%; background:var(--card); color:var(--sub); padding:0; opacity:0; transition:opacity .12s; }
  .btn-resp svg { width:14px; height:14px; }
  .msg.cliente .btn-resp { right:-36px; }
  .msg.bot .btn-resp, .msg.atendente .btn-resp { left:-36px; }
  .msg:hover .btn-resp, .btn-resp:focus-visible { opacity:1; }
  @media (hover: none) { .btn-resp { opacity:.55; } }
  .cita { display:block; margin:0 0 6px; padding:5px 8px; border-left:3px solid var(--sub); border-radius:6px;
          background:var(--hover); font-size:12px; color:var(--sub); cursor:pointer; white-space:normal;
          overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .cita b { display:block; color:var(--txt); font-size:11px; font-weight:600; }
  .msg.destacar { animation:destacar 1.4s; }
  @keyframes destacar { 0%, 40% { box-shadow:0 0 0 3px var(--sub); } 100% { box-shadow:0 0 0 0 transparent; } }
  .msg .midia { color:var(--sub); }
  .m-img { display:block; max-width:min(280px, 100%); max-height:320px; border-radius:8px; cursor:zoom-in; }
  .m-video { display:block; max-width:min(300px, 100%); max-height:360px; border-radius:8px; background:#000; }
  .m-audio { display:block; width:min(280px, 62vw); height:40px; }
  .m-doc { display:inline-flex; align-items:center; gap:6px; color:inherit; font-weight:500; }
  .m-legenda { margin-top:6px; }
  .m-baixar { display:block; margin-top:2px; font-size:11px; color:var(--sub); }
  .dia { align-self:center; font-size:12px; color:var(--sub); margin:10px 0 4px; }

  .compor { background:var(--card); border-top:1px solid var(--borda); }
  .anexo { display:flex; align-items:center; gap:10px; margin:10px 12px 0; padding:8px 10px; border:1px solid var(--borda); border-radius:8px; background:var(--bg); font-size:13px; }
  .anexo[hidden] { display:none; }
  .anexo.respondendo { border-left:3px solid var(--sub); }
  .anexo.respondendo .nome-arq b { display:block; font-size:12px; }
  .anexo.respondendo .nome-arq span { color:var(--sub); }
  .anexo .nome-arq { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .anexo .tam { color:var(--sub); font-size:12px; }
  .anexo img, .anexo video { width:44px; height:44px; object-fit:cover; border-radius:6px; }
  .progresso { height:3px; margin:0 12px; background:var(--borda); border-radius:2px; overflow:hidden; }
  .progresso[hidden] { display:none; }
  .progresso div { height:100%; width:0; background:var(--txt); transition:width .15s; }
  .gravando { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .gravando[hidden] { display:none; }
  .gravando .rec { width:10px; height:10px; border-radius:50%; background:#ef4444; animation:pisca 1s infinite; }
  .gravando .tempo { flex:1; font-variant-numeric:tabular-nums; }
  @keyframes pisca { 50% { opacity:.3; } }
  .icone { flex:none; width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--borda); border-radius:8px; background:var(--card); color:var(--sub); padding:0; }
  .icone:hover { background:var(--hover); color:var(--txt); }
  .icone svg { width:18px; height:18px; }
  .resposta { display:flex; align-items:flex-end; gap:8px; padding:10px 12px; }
  .resposta[hidden] { display:none; }
  .resposta textarea { flex:1; resize:none; height:40px; max-height:140px; padding:9px 12px; border-radius:8px; border:1px solid var(--borda); background:var(--bg); outline:none; }
  .resposta textarea:focus { border-color:var(--sub); }
  .resposta #enviar, .gravando .enviar-audio { height:40px; border:0; border-radius:8px; background:var(--acc); color:var(--acc-txt); font-weight:600; padding:0 16px; }
  .resposta button:disabled, .gravando button:disabled { opacity:.5; }
  .placeholder { flex:1; display:grid; place-items:center; color:var(--sub); padding:20px; text-align:center; }

  @media (max-width: 760px) {
    /* 16px evita o zoom automático do iPhone ao tocar nos campos */
    .filtros input, .resposta textarea { font-size:16px; }
    header { padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top)); gap:8px; }
    header h1, .espaco { display:none; }
    .abas { flex:1; }
    .aba { flex:1; padding:6px 8px; }
    .global { padding:6px 10px; }
    #global-txt { display:none; }
    .funil-topo { flex-direction:column; align-items:stretch; padding:10px 12px; gap:10px; }
    .kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px 6px; }
    .kpi b { font-size:16px; }
    .kpi span { font-size:11px; }
    .colunas { grid-template-columns:repeat(6, calc(100vw - 56px)); padding:10px 12px; scroll-snap-type:x mandatory; scroll-padding:0 12px; }
    .coluna { scroll-snap-align:start; }
    main { grid-template-columns:minmax(0, 1fr); }
    .lista { border-right:0; }
    main.abrir .lista { display:none; }
    main:not(.abrir) .conversa { display:none; }
    .filtros { padding:10px 12px; }
    .chips { margin:0 -12px; padding:0 12px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { padding:7px 12px; }
    .item { padding:14px 12px; }
    .topo { padding:10px 12px; }
    .topo-linha { gap:8px; }
    .voltar { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; margin-left:-6px; padding:0; }
    .quem { flex:1 1 calc(100% - 44px); }
    .topo .sub { font-size:12px; }
    .acoes { width:100%; justify-content:space-between; }
    .st-pop { left:0; right:auto; }
    .btn { padding:8px 14px; }
    .msgs { padding:12px 10px; }
    .msg { max-width:86%; }
    .resposta, .gravando { padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
    .resposta { gap:6px; }
    .resposta textarea { height:42px; }
    .resposta button#enviar { padding:0 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Casa das Bicicletas</h1>
    <div class="abas" id="abas">
      <button class="aba ativa" data-v="conversas">Conversas</button>
      <button class="aba" data-v="funil">Funil</button>
    </div>
    <div class="espaco"></div>
    <button class="global" id="global" title="Liga/desliga a automação para todo mundo"><span class="ponto"></span><span id="global-txt">…</span></button>
    <a href="/crm/sair">Sair</a>
  </header>
  <main id="main">
    <section class="lista">
      <div class="filtros">
        <input id="busca" type="search" placeholder="Buscar nome, telefone ou anúncio">
        <div class="chips" id="chips">
          <button class="chip ativo" data-f="todas">Todas</button>
          <button class="chip" data-f="anuncio">Anúncio</button>
          <button class="chip" data-f="organico">Orgânico</button>
          <button class="chip" data-f="nao_lidas">Não lidas</button>
        </div>
        <div class="st-menu">
          <button type="button" class="filtro-st" id="filtro-st-btn"><span id="filtro-st-txt">Todos os status</span><span class="caret">▼</span></button>
          <div class="st-pop" id="filtro-st-pop" hidden></div>
        </div>
      </div>
      <div class="itens" id="itens"></div>
    </section>
    <section class="conversa" id="conversa">
      <div class="placeholder">Escolha uma conversa.</div>
    </section>
  </main>
  <section class="funil" id="funil">
    <div class="funil-topo">
      <div class="kpis" id="kpis"></div>
      <div class="chips" id="funil-chips">
        <button class="chip ativo" data-f="todas">Todas</button>
        <button class="chip" data-f="anuncio">Anúncio</button>
        <button class="chip" data-f="organico">Orgânico</button>
      </div>
    </div>
    <div class="colunas" id="colunas"></div>
  </section>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const PAUSA_MANUAL = 253402300799000;

let estado = {
  filtro: 'todas', busca: '', jid: null, status: [], botAtivo: true, automacao: 'anuncio', ultimaQtd: 0, topoAtual: '',
  visao: 'conversas', funilFiltro: 'todas', arrastando: false, filtroStatus: '',
};
try { if (localStorage.getItem('crm-visao') === 'funil') estado.visao = 'funil'; } catch {}

async function api(caminho, corpo) {
  const r = await fetch('/crm/api/' + caminho, corpo === undefined ? {} :
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  if (r.status === 401) { location.reload(); throw new Error('login'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'erro');
  return j;
}

const nomeDe = (c) => c.nome || (c.telefone ? '+' + c.telefone : 'Sem nome');
const pausado = (c) => c.pausado_ate > Date.now();
function hora(ms) {
  if (!ms) return '';
  const d = new Date(ms), hoje = new Date();
  return d.toDateString() === hoje.toDateString()
    ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
function textoPausa(c) {
  if (!pausado(c)) return '';
  if (c.pausado_ate >= PAUSA_MANUAL) return 'Bot pausado';
  return 'Bot pausado até ' + new Date(c.pausado_ate).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
// Etiqueta colorida para conversa vinda de anúncio (já escapada)
const origemHtml = (c) => c.origem === 'anuncio'
  ? `<span class="ads">Anúncio</span>${esc(c.anuncio_titulo || '')}`
  : 'Orgânico';
const CLASSE_STATUS = { 'novo': 'st-novo', 'aguardando humano': 'st-humano', 'em atendimento': 'st-atend', 'aguardando cliente': 'st-aguard', 'vendido': 'st-vendido', 'perdido': 'st-perdido' };
const classeStatus = (s) => `st ${CLASSE_STATUS[s] ?? 'st-novo'}`;
const statusHtml = (s) => `<span class="${classeStatus(s)}">${esc(s)}</span>`;

// ---------- estado global ----------
async function carregarEstado(corpo) {
  const e = await api('estado', corpo);
  Object.assign(estado, { botAtivo: e.botAtivo, status: e.status, automacao: e.automacao });
  $('#global').classList.toggle('off', !e.botAtivo);
  $('#global-txt').textContent = e.botAtivo ? 'Automação ligada' : 'Automação pausada';
}
$('#global').onclick = () => {
  const msg = estado.botAtivo ? 'Pausar a automação para TODOS os clientes?' : 'Ligar a automação de novo?';
  if (confirm(msg)) carregarEstado({ ativo: !estado.botAtivo });
};

// ---------- lista ----------
async function carregarLista() {
  const q = new URLSearchParams({ filtro: estado.filtro, q: estado.busca, status: estado.filtroStatus });
  const lista = await api('conversas?' + q);
  const itens = $('#itens');
  if (!lista.length) { itens.innerHTML = '<div class="vazio">Nenhuma conversa.</div>'; return; }
  itens.innerHTML = lista.map((c) => `
    <button class="item ${c.jid === estado.jid ? 'sel' : ''}" data-jid="${esc(c.jid)}">
      <div class="linha"><span class="nome">${esc(nomeDe(c))}</span><span class="hora">${hora(c.ultima_msg_em)}</span></div>

      <div class="info">${statusHtml(c.status)} ${[origemHtml(c), pausado(c) ? 'pausado' : ''].filter(Boolean).join(' · ')}</div>

}
$('#itens').onclick = (e) => { const b = e.target.closest('.item'); if (b) abrir(b.dataset.jid); };
$('#chips').onclick = (e) => {

$('#filtro-st-btn').onclick = (e) => { e.stopPropagation(); $('#filtro-st-pop').hidden = !$('#filtro-st-pop').hidden; };
$('#filtro-st-pop').onclick = (e) => {

$('#busca').oninput = (e) => { clearTimeout(tBusca); tBusca = setTimeout(() => { estado.busca = e.target.value.trim(); carregarLista(); }, 250); };

// No celular a conversa ocupa a tela: o botão voltar do aparelho volta para a lista
const celular = () => matchMedia('(max-width:760px)').matches;
function fecharConversa() {
  $('#main').classList.remove('abrir'); estado.jid = null; carregarLista();
}
addEventListener('popstate', () => { if (estado.jid) fecharConversa(); });

function abrir(jid) {
  if (celular() && !estado.jid) history.pushState({ conversa: true }, '');
  estado.jid = jid; estado.ultimaQtd = 0; estado.topoAtual = '';
  $('#main').classList.add('abrir');
  $('#conversa').innerHTML = '<div class="placeholder">Carregando…</div>';

}

function renderTopo(c) {
  const p = pausado(c);
  const telefone = c.telefone ? `<a href="https://wa.me/${esc(c.telefone)}" target="_blank" rel="noopener">+${esc(c.telefone)}</a>` : '';
  const automacaoVale = estado.automacao === 'todos' || c.origem === 'anuncio';
  const anuncio = c.origem === 'anuncio'
    ? `${origemHtml(c)}${c.anuncio_url ? ` (<a href="${esc(c.anuncio_url)}" target="_blank" rel="noopener">abrir</a>)` : ''}`
    : 'Orgânico · sem automação';
  return `
    <div class="topo">
      <div class="topo-linha">
        <button class="voltar" id="voltar" aria-label="Voltar">←</button>
        <div class="quem">
          <h2>${esc(nomeDe(c))}</h2>
          <div class="sub">${[telefone, anuncio, p ? textoPausa(c) : ''].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="acoes">

              `<button type="button" class="st-op" data-s="${esc(s)}">${statusHtml(s)}${s === c.status ? '<span class="ok">✓</span>' : ''}</button>`).join('')}</div>
          </div>
          ${automacaoVale ? `<button class="btn ${p ? 'primario' : ''}" id="pausa">${p ? 'Retomar bot' : 'Pausar bot'}</button>` : ''}
        </div>
      </div>
    </div>`;
}

// Foto, vídeo, áudio ou documento dentro do balão (mídia antiga, sem arquivo, aparece como [tipo])
function midiaHtml(m) {
  const u = m.midia_url ? esc(m.midia_url) : '';
  const legenda = m.texto && m.tipo !== 'documento' ? `<div class="m-legenda">${esc(m.texto)}</div>` : '';
  if (!u) return `<span class="midia">[${esc(m.tipo)}]</span>${m.texto ? ' ' + esc(m.texto) : ''}`;
  if (m.tipo === 'imagem' || m.tipo === 'figurinha') {
    return `<a href="${u}" target="_blank" rel="noopener"><img class="m-img" src="${u}" loading="lazy" alt=""></a>${legenda}`;
  }
  if (m.tipo === 'video') return `<video class="m-video" src="${u}" controls preload="metadata" playsinline></video>${legenda}`;
  if (m.tipo === 'audio') {
    const transcricao = m.texto ? `<div class="m-legenda"><span class="midia">Transcrição:</span> ${esc(m.texto)}</div>` : '';
    return `<audio class="m-audio" src="${u}" controls preload="none"></audio><a class="m-baixar" href="${u}" download>baixar áudio</a>${transcricao}`;
  }
  return `<a class="m-doc" href="${u}" target="_blank" rel="noopener">📄 ${esc(m.texto || 'Documento')}</a>`;
}

const ICONE_RESP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';
const quemCitado = (autor) => (autor === 'cliente' ? 'Cliente' : 'Você');

function renderMsgs(msgs) {
  let dia = '';
  const porId = Object.fromEntries(msgs.filter((m) => m.wa_id).map((m) => [m.wa_id, m]));
  return msgs.map((m) => {
    const d = new Date(m.criado_em).toLocaleDateString('pt-BR');
    const sep = d !== dia ? `<div class="dia">${d}</div>` : '';
    dia = d;
    const quem = { bot: 'Bot · ', atendente: 'Atendente · ' }[m.autor] ?? '';
    const corpo = m.tipo === 'texto' ? esc(m.texto) : midiaHtml(m);
    const original = m.cita_id && porId[m.cita_id];
    const cita = m.cita_id
      ? `<span class="cita" data-ir="${esc(m.cita_id)}"><b>${original ? quemCitado(original.autor) : 'Mensagem'}</b>${esc(m.cita_texto || '')}</span>`
      : '';
    const resp = m.wa_id ? `<button type="button" class="btn-resp" title="Responder" aria-label="Responder">${ICONE_RESP}</button>` : '';
    return `${sep}<div class="msg ${esc(m.autor)}" data-id="${esc(m.wa_id || '')}" data-autor="${esc(m.autor)}" data-texto="${esc((m.texto || `[${m.tipo}]`).slice(0, 200))}">${resp}${cita}${corpo}<div class="meta">${quem}${new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}</div></div>`;
  }).join('');
}

const assinaturaTopo = ({ nao_lidas, ultima_msg, ultima_msg_em, visto_em, notas, ...resto }) => JSON.stringify(resto);

async function carregarConversa(primeira) {
  const jid = estado.jid;
  if (!jid) return;
  const { contato: c, mensagens } = await api('conversas/' + encodeURIComponent(jid));
  if (jid !== estado.jid) return;

  if (primeira) {
    $('#conversa').innerHTML = `${renderTopo(c)}
      <div class="msgs" id="msgs"></div>
      <div class="compor">
        <div class="anexo respondendo" id="resp-cita" hidden>
          <span class="nome-arq"><b id="resp-autor"></b><span id="resp-texto"></span></span>
          <button type="button" class="icone" id="resp-x" title="Cancelar resposta" style="width:28px;height:28px">✕</button>
        </div>
        <div class="anexo" id="anexo" hidden>
          <span id="anexo-prev"></span><span class="nome-arq" id="anexo-nome"></span><span class="tam" id="anexo-tam"></span>
          <button type="button" class="icone" id="anexo-x" title="Remover anexo" style="width:28px;height:28px">✕</button>
        </div>
        <div class="progresso" id="progresso" hidden><div></div></div>
        <div class="gravando" id="gravando" hidden>
          <span class="rec"></span><span class="tempo" id="grav-tempo">0:00</span>
          <button type="button" class="btn" id="grav-cancelar">Cancelar</button>
          <button type="button" class="enviar-audio" id="grav-enviar">Enviar áudio</button>
        </div>
        <form class="resposta" id="form-resp">
          <input type="file" id="arquivo" hidden accept="image/*,video/*,audio/*,application/pdf">
          <button type="button" class="icone" id="btn-anexar" title="Anexar foto, vídeo ou documento">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <textarea id="txt" placeholder="Responder…" title="Ao responder, o bot pausa sozinho com este cliente" rows="1"></textarea>
          <button type="button" class="icone" id="btn-gravar" title="Gravar áudio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
          </button>
          <button id="enviar">Enviar</button>
        </form>
      </div>`;
    ligarTopo(c);
    ligarResposta();
  } else if ($('#st-pop')?.hidden !== false && assinaturaTopo(c) !== estado.topoAtual) {
    $('.topo').outerHTML = renderTopo(c);
    ligarTopo(c);
  }
  estado.topoAtual = assinaturaTopo(c);

  // Redesenha quando chega mensagem nova ou quando a mídia de alguma termina de baixar
  const assinatura = `${mensagens.length}:${mensagens.filter((m) => m.midia_url).length}`;
  if (primeira || assinatura !== estado.ultimaQtd) {
    const box = $('#msgs');
    const noFim = primeira || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = mensagens.length ? renderMsgs(mensagens) : '<div class="vazio">Sem mensagens.</div>';
    if (noFim) {
      box.scrollTop = box.scrollHeight;

      box.querySelectorAll('img').forEach((img) => img.addEventListener('load', () => { box.scrollTop = box.scrollHeight; }, { once: true }));

function ligarTopo(c) {
  const url = 'conversas/' + encodeURIComponent(c.jid);
  $('#voltar').onclick = () => (history.state?.conversa ? history.back() : fecharConversa());
  const pop = $('#st-pop');
  $('#status-btn').onclick = (e) => { e.stopPropagation(); pop.hidden = !pop.hidden; };
  pop.onclick = async (e) => {
    const op = e.target.closest('.st-op'); if (!op) return;
    pop.hidden = true;
    await api(url + '/status', { status: op.dataset.s });
    await carregarConversa(false); carregarLista();
  };
  const pausa = $('#pausa');
  if (pausa) pausa.onclick = async () => {
    pausa.disabled = true;
    await api(url + '/pausar', { pausado: !pausado(c) });
    await carregarConversa(false); carregarLista();
  };
}

const LIMITE_MB = 64;
const tamanho = (b) => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.ceil(b / 1024) + ' KB';

// Sobe o arquivo (corpo = o próprio arquivo) com barra de progresso
function subirArquivo(jid, blob, nome, legenda, responder) {
  return new Promise((ok, erro) => {
    const q = new URLSearchParams({ nome, legenda, ...(responder && { responder }) });
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/crm/api/conversas/' + encodeURIComponent(jid) + '/arquivo?' + q);
    xhr.setRequestHeader('Content-Type', (blob.type || 'application/octet-stream').split(';')[0]);
    const barra = $('#progresso'), fill = barra?.firstElementChild;
    if (barra) barra.hidden = false;
    xhr.upload.onprogress = (e) => { if (fill && e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%'; };
    xhr.onloadend = () => {
      if (barra) { barra.hidden = true; fill.style.width = '0'; }
      if (xhr.status === 401) return location.reload();
      let j = {}; try { j = JSON.parse(xhr.responseText); } catch {}
      xhr.status >= 200 && xhr.status < 300 ? ok(j) : erro(new Error(j.erro || 'falha ao enviar'));
    };
    xhr.send(blob);
  });
}

function ligarResposta() {
  const txt = $('#txt'), btn = $('#enviar'), input = $('#arquivo');
  let anexo = null;
  const jid = estado.jid;

  txt.oninput = () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 140) + 'px'; };
  txt.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !celular()) { e.preventDefault(); $('#form-resp').requestSubmit(); }
    if (e.key === 'Escape' && respondendo) limparResposta();
  };

  // ---- responder citando uma mensagem ----
  let respondendo = null; // wa_id da mensagem citada
  function limparResposta() { respondendo = null; $('#resp-cita').hidden = true; }
  $('#resp-x').onclick = limparResposta;
  $('#msgs').onclick = (e) => {
    const b = e.target.closest('.btn-resp');
    if (b) {
      const m = b.closest('.msg');
      respondendo = m.dataset.id;
      $('#resp-autor').textContent = quemCitado(m.dataset.autor);
      $('#resp-texto').textContent = m.dataset.texto;
      $('#resp-cita').hidden = false;
      txt.focus();
      return;
    }
    const c = e.target.closest('.cita');
    const alvo = c && document.querySelector(`.msg[data-id="${CSS.escape(c.dataset.ir)}"]`);
    if (alvo) {
      alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
      alvo.classList.remove('destacar'); void alvo.offsetWidth; alvo.classList.add('destacar');
    }
  };

  // ---- anexo ----
  function limparAnexo() {
    anexo = null; input.value = '';
    $('#anexo').hidden = true; $('#anexo-prev').innerHTML = '';
    txt.placeholder = 'Responder…';
  }
  $('#btn-anexar').onclick = () => input.click();
  $('#anexo-x').onclick = limparAnexo;
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    if (f.size > LIMITE_MB * 1048576) { alert(`Arquivo muito grande (máx. ${LIMITE_MB} MB).`); input.value = ''; return; }
    anexo = f;
    const url = URL.createObjectURL(f);
    $('#anexo-prev').innerHTML = f.type.startsWith('image/') ? `<img src="${url}" alt="">`
      : f.type.startsWith('video/') ? `<video src="${url}" muted></video>` : (f.type.startsWith('audio/') ? '🎵' : '📄');
    $('#anexo-nome').textContent = f.name;
    $('#anexo-tam').textContent = tamanho(f.size);
    $('#anexo').hidden = false;
    txt.placeholder = f.type.startsWith('audio/') ? 'Áudio (sem legenda)' : 'Legenda (opcional)';
    txt.focus();
  };

  // ---- enviar texto ou anexo ----
  $('#form-resp').onsubmit = async (e) => {
    e.preventDefault();
    const texto = txt.value.trim();
    if (!texto && !anexo) return;
    btn.disabled = true;
    try {
      if (anexo) {
        await subirArquivo(jid, anexo, anexo.name, anexo.type.startsWith('audio/') ? '' : texto, respondendo);
        limparAnexo();
      } else {
        await api('conversas/' + encodeURIComponent(jid) + '/enviar', { texto, ...(respondendo && { responder: respondendo }) });
      }
      limparResposta();
      txt.value = ''; txt.style.height = '';
      await carregarConversa(false); carregarLista();
    } catch (err) { alert(err.message); }
    btn.disabled = false; txt.focus();
  };

  // ---- gravar áudio (vai como mensagem de voz) ----
  let gravador = null, pedacos = [], inicio = 0, relogio = null, cancelado = false;
  const formato = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/webm']
    .find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));

  function telaGravando(sim) {
    $('#gravando').hidden = !sim; $('#form-resp').hidden = sim;
    clearInterval(relogio);
    if (sim) {
      inicio = Date.now();
      relogio = setInterval(() => {
        const s = Math.floor((Date.now() - inicio) / 1000);
        $('#grav-tempo').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      }, 250);
    }
  }

  $('#btn-gravar').onclick = async () => {
    if (!window.MediaRecorder || !navigator.mediaDevices) return alert('Este navegador não grava áudio.');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return alert('Não consegui acessar o microfone. Libere a permissão do microfone para este site.'); }
    pedacos = []; cancelado = false;
    gravador = new MediaRecorder(stream, formato ? { mimeType: formato } : undefined);
    gravador.ondataavailable = (e) => e.data.size && pedacos.push(e.data);
    gravador.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      telaGravando(false);
      if (cancelado || !pedacos.length) return;
      const tipo = (gravador.mimeType || formato || 'audio/webm').split(';')[0];
      const blob = new Blob(pedacos, { type: tipo });
      const ext = { 'audio/ogg': 'ogg', 'audio/mp4': 'm4a' }[tipo] ?? 'webm';
      try {
        await subirArquivo(jid, blob, `audio.${ext}`, '', respondendo);
        limparResposta();
        await carregarConversa(false); carregarLista();
      } catch (err) { alert(err.message); }
    };
    gravador.start();
    telaGravando(true);
  };
  $('#grav-cancelar').onclick = () => { cancelado = true; gravador?.stop(); };
  $('#grav-enviar').onclick = () => { cancelado = false; gravador?.stop(); };
}

function mostrarVisao(v) {
  estado.visao = v;
  try { localStorage.setItem('crm-visao', v); } catch {}
  document.querySelector('.app').classList.toggle('ver-funil', v === 'funil');
  document.querySelectorAll('.aba').forEach((a) => a.classList.toggle('ativa', a.dataset.v === v));
  if (v === 'funil') carregarFunil(); else carregarLista();
}
$('#abas').onclick = (e) => { const a = e.target.closest('.aba'); if (a) mostrarVisao(a.dataset.v); };
$('#funil-chips').onclick = (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('#funil-chips').querySelectorAll('.chip').forEach((x) => x.classList.toggle('ativo', x === b));
  estado.funilFiltro = b.dataset.f; carregarFunil();
};

async function carregarFunil() {
  if (estado.arrastando) return;
  const lista = await api('conversas?' + new URLSearchParams({ filtro: estado.funilFiltro }));
  const por = Object.fromEntries(estado.status.map((s) => [s, []]));
  for (const c of lista) (por[c.status] ?? por['novo']).push(c);

  const n = (s) => por[s]?.length ?? 0;
  const abertas = n('novo') + n('aguardando humano') + n('em atendimento') + n('aguardando cliente');
  const fechadas = n('vendido') + n('perdido');
  const taxa = fechadas ? Math.round((n('vendido') / fechadas) * 100) + '%' : '—';
  $('#kpis').innerHTML = [
    [lista.length, 'conversas'],
    [lista.filter((c) => c.origem === 'anuncio').length, 'de anúncio'],
    [n('aguardando humano'), 'aguardando humano'],
    [abertas, 'em aberto'],
    [n('vendido'), 'vendidas'],
    [taxa, 'conversão'],
  ].map(([v, r]) => `<div class="kpi"><b>${v}</b><span>${r}</span></div>`).join('');

  $('#colunas').innerHTML = estado.status.map((s) => `
    <div class="coluna" data-s="${esc(s)}">
      <div class="col-topo">${statusHtml(s)}<span class="col-qtd">${n(s)}</span></div>
      <div class="cartoes">${n(s) ? por[s].map((c) => `
        <button class="cartao" draggable="true" data-jid="${esc(c.jid)}">
          <div class="linha"><span class="nome">${esc(nomeDe(c))}</span><span class="hora">${hora(c.ultima_msg_em)}</span></div>
          <span class="previa">${esc(c.ultima_msg || '')}</span>
          <div class="info">${[origemHtml(c), pausado(c) ? 'pausado' : ''].filter(Boolean).join(' · ')}</div>
        </button>`).join('') : '<div class="col-vazia">Nenhuma conversa</div>'}</div>
    </div>`).join('');
}

// Clique abre a conversa; arrastar entre colunas muda o status
$('#colunas').onclick = (e) => {
  const c = e.target.closest('.cartao'); if (!c) return;
  mostrarVisao('conversas'); abrir(c.dataset.jid);
};
$('#colunas').addEventListener('dragstart', (e) => {
  const c = e.target.closest('.cartao'); if (!c) return;
  estado.arrastando = true;
  e.dataTransfer.setData('text/plain', c.dataset.jid);
  e.dataTransfer.effectAllowed = 'move';
  c.classList.add('arrastando');
});
$('#colunas').addEventListener('dragend', () => {
  estado.arrastando = false;
  document.querySelectorAll('.cartao.arrastando, .coluna.alvo').forEach((x) => x.classList.remove('arrastando', 'alvo'));
});
$('#colunas').addEventListener('dragover', (e) => {
  const col = e.target.closest('.coluna'); if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.coluna.alvo').forEach((x) => x !== col && x.classList.remove('alvo'));
  col.classList.add('alvo');
});
$('#colunas').addEventListener('drop', async (e) => {
  const col = e.target.closest('.coluna'); if (!col) return;
  e.preventDefault();
  const jid = e.dataTransfer.getData('text/plain');
  estado.arrastando = false;
  await api('conversas/' + encodeURIComponent(jid) + '/status', { status: col.dataset.s });
  carregarFunil();
});

// ---------- atualização automática ----------
carregarEstado().then(() => { montarFiltroStatus(); mostrarVisao(estado.visao); });
setInterval(() => {
  if (document.hidden) return;
  if (estado.visao === 'funil') return void carregarFunil().catch(() => {});
  carregarLista().catch(() => {});
  carregarConversa(false).catch(() => {});
}, 5000);
</script>
