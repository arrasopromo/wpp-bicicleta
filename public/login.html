<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM · Casa das Bicicletas</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --txt:#18181b; --sub:#71717a; --borda:#e4e4e7; --acc:#18181b; --acc-txt:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f11; --card:#18181b; --txt:#f4f4f5; --sub:#a1a1aa; --borda:#27272a; --acc:#f4f4f5; --acc-txt:#18181b; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt);
         font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:28px 24px; width:100%; max-width:340px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--sub); font-size:14px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--borda); background:var(--bg); color:var(--txt); font-size:16px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:10px; background:var(--acc); color:var(--acc-txt); font-size:16px; font-weight:600; cursor:pointer; }
  .erro { color:#dc2626; font-size:14px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Casa das Bicicletas</h1>
  <p>Painel de conversas do WhatsApp</p>
  <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" autofocus required>
  <button>Entrar</button>
  <div class="erro" id="erro"></div>
</form>
<script>
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch('/crm/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha: document.getElementById('senha').value }) });
    if (r.ok) location.reload();
    else document.getElementById('erro').textContent = (await r.json()).erro || 'Erro ao entrar';
  };
</script>
</body>
</html>
